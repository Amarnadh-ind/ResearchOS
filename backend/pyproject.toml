[project]
name = "researchos-backend"
version = "0.1.0"
description = "ResearchOS - Autonomous Multi-Agent Research Laboratory"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require real API keys)",
]
